<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SFLog | platojobs</title>
    <meta
      name="description"
      content="SFLog by platojobs: a paginated issue-powered reading blog on GitHub Pages."
    />
    <meta name="theme-color" content="#101214" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="left-rail">
        <a class="brand" href="./">SFLog</a>
        <p class="brand-copy">
          用 GitHub issue 写作，用 GitHub Pages 阅读。
        </p>

        <div class="rail-card">
          <p class="rail-label">Overview</p>
          <dl class="stats">
            <div>
              <dt>Posts</dt>
              <dd id="total-posts">--</dd>
            </div>
            <div>
              <dt>Labels</dt>
              <dd id="label-count">--</dd>
            </div>
            <div>
              <dt>Latest</dt>
              <dd id="latest-date">--</dd>
            </div>
          </dl>
        </div>

        <div class="rail-card">
          <label class="search-block">
            <span class="rail-label">Search</span>
            <input id="search-input" type="search" placeholder="搜索标题、摘要、标签" />
          </label>
        </div>

        <div class="rail-card">
          <p class="rail-label">Labels</p>
          <div id="label-filters" class="label-filters"></div>
        </div>
      </aside>

      <main class="timeline-column">
        <header class="timeline-header">
          <div>
            <p class="eyebrow">Issue Journal</p>
            <h1>文章摘要流</h1>
          </div>
          <a class="compose-link" href="https://github.com/platojobs/SFLOG/issues" target="_blank" rel="noreferrer">
            写新文章
          </a>
        </header>

        <div class="timeline-toolbar">
          <p id="result-count" class="result-count">加载中...</p>
          <div class="page-size">
            <label for="page-size-select">每页</label>
            <select id="page-size-select">
              <option value="5">5</option>
              <option value="8" selected>8</option>
              <option value="10">10</option>
            </select>
          </div>
        </div>

        <section id="post-list" class="post-list" aria-live="polite"></section>

        <nav class="pagination" aria-label="Pagination">
          <button id="prev-page" class="pager-button" type="button">上一页</button>
          <span id="page-indicator" class="page-indicator">-- / --</span>
          <button id="next-page" class="pager-button" type="button">下一页</button>
        </nav>
      </main>

      <aside class="reader-column">
        <div class="reader-card">
          <div id="reader-shell" class="reader-shell">
            <div class="reader-empty">
              <p class="eyebrow">Reader</p>
              <h2>选择一篇文章开始阅读。</h2>
              <p>列表只显示摘要，点击后在这里展开完整内容。</p>
            </div>
          </div>
        </div>

        <div class="comments-card">
          <p class="eyebrow">Comments</p>
          <h3>评论系统预留</h3>
          <p>
            这里后续可以接入 Giscus、Utterances 或自定义 issue comments，
            当前先保留位置和样式结构。
          </p>
        </div>
      </aside>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
